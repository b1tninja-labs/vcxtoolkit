[package]
name = "vcxcomm-open"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Win32 calls for the VCX USB serial open"
license = "Apache-2.0"
publish = false

[dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Devices_Communication",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
