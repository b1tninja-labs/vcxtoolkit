[workspace]
members = ["j2534"]
# `winport` stays a path dependency, not a workspace member, exactly as it was
# before the J2534 crate was added: it keeps its own `unsafe_code = "deny"`
# boundary and its own formatting, and the gates do not reformat a file this
# change never touched.
exclude = ["winport"]
# The four gates run from this directory with no `--workspace` flag (AGENTS.md).
# `default-members` makes that single pass cover the root crate and the cdylib
# member, holding the DLL to the same fmt/clippy/test/doc bar as the library.
default-members = [".", "j2534"]

[package]
name = "vcxtoolkit"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "VCX serial frames for a VXDIAG dongle"
license = "Apache-2.0"
readme = "README.md"
publish = false

[[bin]]
name = "vcxtoolkit"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
vcxtoolkit-open = { path = "winport", version = "0.1.0" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
